services:
  fe-admin:
    container_name: cinx-fe-admin
    image: ${DOCKERHUB_USERNAME}/cinx-fe-admin:latest
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "${HOST_PORT}:80"
    restart: unless-stopped
    env_file:
      - .env
